name: Build and test

on:
  push:
    branches: [main, develop]
    tags: ["macos-v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check build environment
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          xcrun --sdk macosx --show-sdk-version
          swift --version
          python3 -c 'import re,subprocess; sdk=subprocess.check_output(["xcrun","--sdk","macosx","--show-sdk-version"],text=True).strip(); swift=subprocess.check_output(["swift","--version"],text=True); assert int(sdk.split(".")[0]) >= 27; version=re.search(r"Swift version (\d+)\.(\d+)",swift); assert version and tuple(map(int,version.groups())) >= (6,4)'
      - name: Match release tag to app version
        if: startsWith(github.ref, 'refs/tags/macos-v')
        run: |
          declared="$(sed -n 's/.*static let version="\([^"]*\)".*/\1/p' Sources/HeyBuds/AppIdentity.swift)"
          test "$declared" = "${GITHUB_REF_NAME#macos-v}"
      - name: Audit public source
        run: python3 scripts/audit-source.py
      - name: Run protocol, session and presentation tests
        run: swift test --no-parallel
      - name: Build ad-hoc-signed local application
        run: bash scripts/build.sh
      - name: Verify application and DMG contents
        run: python3 scripts/audit-app.py
      - name: Package public source
        run: python3 scripts/package-source.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeviceDeck-macos-arm64
          path: |
            dist/DeviceDeck-macos-arm64.dmg
            releases/DeviceDeck-v*-source.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a commit merged to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@v4
        with:
          name: DeviceDeck-macos-arm64
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#macos-v}"
          assets=(release-assets/dist/DeviceDeck-macos-arm64.dmg release-assets/releases/DeviceDeck-v*-source.zip)
          test "${#assets[@]}" -eq 2
          test -f "${assets[0]}" && test -f "${assets[1]}"
          if [[ "$version" =~ (alpha|beta|rc) ]]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --prerelease --latest=false --title "DeviceDeck macOS $version" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --latest --title "DeviceDeck macOS $version" --generate-notes
          fi
